[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naukri-autopilot"
version = "0.0.1"
description = "Keeps your Naukri profile fresh on a schedule, entirely on your own machine."
requires-python = ">=3.9"
# Everything needed to actually use the tool. The dashboard used to sit behind
# an optional extra, which meant `pip install -e .` produced an install where
# `dashboard` failed at runtime - a setup trap with no good reason to exist.
dependencies = [
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=7",
]

[project.scripts]
naukri-autopilot = "naukri_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
